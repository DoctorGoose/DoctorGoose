<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Pickup FFT Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 14px;
        }
        
        .status.active {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel h2 {
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 18px;
        }
        
        canvas {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }
        
        .waveform-canvas, .fft-canvas {
            height: 300px;
        }
        
        .spectrogram-canvas, .bode-canvas {
            height: 300px;
        }
        
        @media (max-width: 768px) {
            .waveform-canvas, .fft-canvas {
                height: 200px;
            }
            
            .spectrogram-canvas {
                height: 250px;
            }
            
            .bode-canvas {
                height: 250px;
            }
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #00d4ff;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 24px;
                margin-bottom: 15px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            button {
                width: 100%;
            }
            
            .panel {
                padding: 10px;
            }
            
            .panel h2 {
                font-size: 16px;
                margin-bottom: 8px;
            }
            
            .info {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .info-item {
                padding: 8px;
            }
            
            .info-label {
                font-size: 11px;
            }
            
            .info-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎸 Guitar Pickup FFT Analyzer</h1>
        
        <div class="controls">
            <button id="startBtn">Start Audio Capture</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="freezeBtn" disabled>Freeze</button>
            <div class="status" id="status">Ready</div>
        </div>
        
        <div class="grid">
            <div class="panel">
                <h2>Waveform (Time Domain)</h2>
                <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
            </div>
            
            <div class="panel">
                <h2>FFT Spectrum (Frequency Domain)</h2>
                <canvas id="fftCanvas" class="fft-canvas"></canvas>
            </div>
            
            <div class="panel full-width">
                <h2>Spectrogram (Frequency vs Time Heatmap)</h2>
                <canvas id="spectrogramCanvas" class="spectrogram-canvas"></canvas>
            </div>
            
            <div class="panel full-width">
                <h2>Bode Plot (Magnitude Response)</h2>
                <canvas id="bodeCanvas" class="bode-canvas"></canvas>
                <div class="info">
                    <div class="info-item">
                        <div class="info-label">Peak Frequency</div>
                        <div class="info-value" id="peakFreq">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Fundamental</div>
                        <div class="info-value" id="fundamental">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">RMS Level</div>
                        <div class="info-value" id="rmsLevel">--</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Sample Rate</div>
                        <div class="info-value" id="sampleRate">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let bufferLength;
        let animationId;
        let isFrozen = false;
        
        // Normalization tracking
        let maxWaveformAmplitude = 0;
        let maxFFTMagnitude = 0;
        let maxBodeMagnitude = 0;
        const DECAY_FACTOR = 0.95; // Slow decay for rolling maximum
        const MIN_THRESHOLD = 10; // Minimum threshold to avoid normalizing noise
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const freezeBtn = document.getElementById('freezeBtn');
        const status = document.getElementById('status');
        
        const waveformCanvas = document.getElementById('waveformCanvas');
        const fftCanvas = document.getElementById('fftCanvas');
        const spectrogramCanvas = document.getElementById('spectrogramCanvas');
        const bodeCanvas = document.getElementById('bodeCanvas');
        
        const waveformCtx = waveformCanvas.getContext('2d');
        const fftCtx = fftCanvas.getContext('2d');
        const spectrogramCtx = spectrogramCanvas.getContext('2d');
        const bodeCtx = bodeCanvas.getContext('2d');
        
        // Axis margins
        const MARGIN = { top: 10, right: 20, bottom: 40, left: 60 };
        
        function resizeCanvas(canvas) {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            const ctx = canvas.getContext('2d');
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        
        [waveformCanvas, fftCanvas, spectrogramCanvas, bodeCanvas].forEach(resizeCanvas);
        window.addEventListener('resize', () => {
            [waveformCanvas, fftCanvas, spectrogramCanvas, bodeCanvas].forEach(resizeCanvas);
        });
        
        async function startAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 4096;
                analyser.smoothingTimeConstant = 0.3;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                document.getElementById('sampleRate').textContent = audioContext.sampleRate + ' Hz';
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                freezeBtn.disabled = false;
                status.textContent = 'Recording...';
                status.classList.add('active');
                
                draw();
            } catch (err) {
                console.error('Error accessing microphone:', err);
                status.textContent = 'Error: ' + err.message;
            }
        }
        
        function stopAudio() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            if (microphone) {
                microphone.disconnect();
            }
            if (audioContext) {
                audioContext.close();
            }
            
            isFrozen = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            freezeBtn.disabled = true;
            freezeBtn.textContent = 'Freeze';
            status.textContent = 'Stopped';
            status.classList.remove('active');
        }
        
        function toggleFreeze() {
            isFrozen = !isFrozen;
            if (isFrozen) {
                freezeBtn.textContent = 'Unfreeze';
                status.textContent = 'Frozen';
            } else {
                freezeBtn.textContent = 'Freeze';
                status.textContent = 'Recording...';
            }
        }
        
        function drawAxes(ctx, width, height, xLabel, yLabel, yMax) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '12px sans-serif';
            ctx.lineWidth = 1;
            
            // Y-axis
            ctx.beginPath();
            ctx.moveTo(MARGIN.left, MARGIN.top);
            ctx.lineTo(MARGIN.left, height - MARGIN.bottom);
            ctx.stroke();
            
            // X-axis
            ctx.beginPath();
            ctx.moveTo(MARGIN.left, height - MARGIN.bottom);
            ctx.lineTo(width - MARGIN.right, height - MARGIN.bottom);
            ctx.stroke();
            
            // Y-axis labels
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let i = 0; i <= 4; i++) {
                const y = MARGIN.top + (height - MARGIN.top - MARGIN.bottom) * i / 4;
                const value = yMax * (1 - i / 4);
                ctx.fillText(value.toFixed(0), MARGIN.left - 5, y);
                
                // Grid lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.moveTo(MARGIN.left, y);
                ctx.lineTo(width - MARGIN.right, y);
                ctx.stroke();
            }
            
            // Axis labels
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Y-axis label
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = '#00d4ff';
            ctx.fillText(yLabel, 0, 0);
            ctx.restore();
            
            // X-axis label
            ctx.fillStyle = '#00d4ff';
            ctx.fillText(xLabel, (width + MARGIN.left - MARGIN.right) / 2, height - 10);
        }
        
        function drawWaveform() {
            const timeData = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(timeData);
            
            const width = waveformCanvas.offsetWidth;
            const height = waveformCanvas.offsetHeight;
            const plotWidth = width - MARGIN.left - MARGIN.right;
            const plotHeight = height - MARGIN.top - MARGIN.bottom;
            
            // Calculate current max amplitude (excluding DC offset)
            let currentMax = 0;
            let sum = 0;
            for (let i = 0; i < timeData.length; i++) {
                sum += timeData[i];
            }
            const dcOffset = sum / timeData.length;
            
            for (let i = 0; i < timeData.length; i++) {
                const amplitude = Math.abs(timeData[i] - dcOffset);
                if (amplitude > currentMax) currentMax = amplitude;
            }
            
            // Update rolling maximum only if signal is significant
            if (currentMax > MIN_THRESHOLD) {
                if (currentMax > maxWaveformAmplitude) {
                    maxWaveformAmplitude = currentMax;
                } else {
                    maxWaveformAmplitude *= DECAY_FACTOR;
                }
            }
            
            // Use a minimum threshold
            const normalizeMax = Math.max(maxWaveformAmplitude, MIN_THRESHOLD * 2);
            
            waveformCtx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            waveformCtx.fillRect(0, 0, width, height);
            
            // Draw axes
            drawAxes(waveformCtx, width, height, 'Time (ms)', 'Amplitude', normalizeMax);
            
            // Draw waveform
            waveformCtx.lineWidth = 2;
            waveformCtx.strokeStyle = '#00d4ff';
            waveformCtx.beginPath();
            
            const timePerSample = 1000 / audioContext.sampleRate; // ms
            const totalTime = timeData.length * timePerSample;
            
            for (let i = 0; i < timeData.length; i++) {
                const amplitude = (timeData[i] - dcOffset);
                const normalizedAmp = amplitude / normalizeMax;
                const x = MARGIN.left + (i / timeData.length) * plotWidth;
                const y = MARGIN.top + plotHeight / 2 - normalizedAmp * plotHeight / 2;
                
                if (i === 0) {
                    waveformCtx.moveTo(x, y);
                } else {
                    waveformCtx.lineTo(x, y);
                }
            }
            
            waveformCtx.stroke();
            
            // Time axis tick marks
            waveformCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            waveformCtx.textAlign = 'center';
            waveformCtx.textBaseline = 'top';
            for (let i = 0; i <= 4; i++) {
                const x = MARGIN.left + plotWidth * i / 4;
                const time = (totalTime * i / 4).toFixed(1);
                waveformCtx.fillText(time, x, height - MARGIN.bottom + 5);
            }
        }
        
        function drawFFT() {
            analyser.getByteFrequencyData(dataArray);
            
            const width = fftCanvas.offsetWidth;
            const height = fftCanvas.offsetHeight;
            const plotWidth = width - MARGIN.left - MARGIN.right;
            const plotHeight = height - MARGIN.top - MARGIN.bottom;
            
            // Calculate current max magnitude
            let currentMax = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > currentMax) currentMax = dataArray[i];
            }
            
            // Update rolling maximum
            if (currentMax > maxFFTMagnitude) {
                maxFFTMagnitude = currentMax;
            } else {
                maxFFTMagnitude *= DECAY_FACTOR;
            }
            
            const normalizeMax = Math.max(maxFFTMagnitude, MIN_THRESHOLD);
            
            fftCtx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            fftCtx.fillRect(0, 0, width, height);
            
            // Draw axes
            drawAxes(fftCtx, width, height, 'Frequency (Hz)', 'Magnitude', normalizeMax);
            
            const nyquist = audioContext.sampleRate / 2;
            const minFreq = 20;
            const maxFreq = Math.min(16000, nyquist);
            
            // Draw bars with logarithmic frequency mapping
            for (let i = 0; i < bufferLength; i++) {
                const freq = (i / bufferLength) * nyquist;
                if (freq < minFreq || freq > maxFreq) continue;
                
                const x = MARGIN.left + (Math.log10(freq) - Math.log10(minFreq)) / 
                          (Math.log10(maxFreq) - Math.log10(minFreq)) * plotWidth;
                
                const normalizedMag = dataArray[i] / normalizeMax;
                const barHeight = normalizedMag * plotHeight;
                const y = MARGIN.top + plotHeight - barHeight;
                
                const hue = ((Math.log10(freq) - Math.log10(minFreq)) / 
                            (Math.log10(maxFreq) - Math.log10(minFreq))) * 240;
                fftCtx.fillStyle = `hsl(${hue}, 100%, ${50 + normalizedMag * 30}%)`;
                fftCtx.fillRect(x, y, 2, barHeight);
            }
            
            // Frequency axis tick marks (logarithmic)
            fftCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            fftCtx.textAlign = 'center';
            fftCtx.textBaseline = 'top';
            const freqMarks = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 16000];
            for (let freq of freqMarks) {
                if (freq >= minFreq && freq <= maxFreq) {
                    const x = MARGIN.left + (Math.log10(freq) - Math.log10(minFreq)) / 
                              (Math.log10(maxFreq) - Math.log10(minFreq)) * plotWidth;
                    const label = freq >= 1000 ? (freq/1000 + 'k') : freq;
                    fftCtx.fillText(label, x, height - MARGIN.bottom + 5);
                }
            }
        }
        
        function drawSpectrogram() {
            analyser.getByteFrequencyData(dataArray);
            
            const width = spectrogramCanvas.offsetWidth;
            const height = spectrogramCanvas.offsetHeight;
            const plotWidth = width - MARGIN.left - MARGIN.right;
            const plotHeight = height - MARGIN.top - MARGIN.bottom;
            
            // Calculate current max for normalization
            let currentMax = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > currentMax) currentMax = dataArray[i];
            }
            
            // Update rolling maximum for spectrogram
            if (currentMax > maxBodeMagnitude) {
                maxBodeMagnitude = currentMax;
            } else {
                maxBodeMagnitude *= DECAY_FACTOR;
            }
            
            const normalizeMax = Math.max(maxBodeMagnitude, MIN_THRESHOLD);
            
            // Shift existing image left
            const imageData = spectrogramCtx.getImageData(
                MARGIN.left + 1, MARGIN.top, 
                plotWidth - 1, plotHeight
            );
            spectrogramCtx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            spectrogramCtx.fillRect(0, 0, width, height);
            spectrogramCtx.putImageData(imageData, MARGIN.left, MARGIN.top);
            
            // Draw axes
            spectrogramCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            spectrogramCtx.lineWidth = 1;
            spectrogramCtx.strokeRect(MARGIN.left, MARGIN.top, plotWidth, plotHeight);
            
            spectrogramCtx.fillStyle = '#00d4ff';
            spectrogramCtx.font = '12px sans-serif';
            spectrogramCtx.textAlign = 'center';
            spectrogramCtx.fillText('Frequency (Hz)', width / 2, height - 10);
            
            spectrogramCtx.save();
            spectrogramCtx.translate(15, height / 2);
            spectrogramCtx.rotate(-Math.PI / 2);
            spectrogramCtx.fillText('Time →', 0, 0);
            spectrogramCtx.restore();
            
            // Draw new column on the right with logarithmic frequency scale
            const nyquist = audioContext.sampleRate / 2;
            const minFreq = 20;
            const maxFreq = 10000;
            
            for (let i = 0; i < bufferLength; i++) {
                const freq = (i / bufferLength) * nyquist;
                if (freq < minFreq || freq > maxFreq) continue;
                
                const normalizedMag = dataArray[i] / normalizeMax;
                
                // Logarithmic Y position
                const logPos = (Math.log10(freq) - Math.log10(minFreq)) / 
                              (Math.log10(maxFreq) - Math.log10(minFreq));
                const y = MARGIN.top + plotHeight * (1 - logPos);
                
                // Enhanced color mapping with normalization
                const intensity = normalizedMag;
                const r = Math.min(255, intensity * 255 * 1.5);
                const g = Math.min(255, intensity * 200);
                const b = Math.max(0, 255 - intensity * 255);
                
                spectrogramCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                spectrogramCtx.fillRect(
                    MARGIN.left + plotWidth - 1, 
                    y, 
                    1, 
                    2
                );
            }
            
            // Frequency labels (logarithmic)
            spectrogramCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            spectrogramCtx.textAlign = 'right';
            spectrogramCtx.textBaseline = 'middle';
            const freqs = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
            for (let freq of freqs) {
                if (freq >= minFreq && freq <= maxFreq) {
                    const logPos = (Math.log10(freq) - Math.log10(minFreq)) / 
                                  (Math.log10(maxFreq) - Math.log10(minFreq));
                    const y = MARGIN.top + plotHeight * (1 - logPos);
                    const label = freq >= 1000 ? (freq/1000 + 'k') : freq;
                    spectrogramCtx.fillText(label, MARGIN.left - 5, y);
                }
            }
        }
        
        function drawBode() {
            analyser.getByteFrequencyData(dataArray);
            
            const width = bodeCanvas.offsetWidth;
            const height = bodeCanvas.offsetHeight;
            const plotWidth = width - MARGIN.left - MARGIN.right;
            const plotHeight = height - MARGIN.top - MARGIN.bottom;
            
            // Calculate current max
            let currentMax = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > currentMax) currentMax = dataArray[i];
            }
            
            if (currentMax > maxBodeMagnitude) {
                maxBodeMagnitude = currentMax;
            } else {
                maxBodeMagnitude *= DECAY_FACTOR;
            }
            
            const normalizeMax = Math.max(maxBodeMagnitude, MIN_THRESHOLD);
            
            bodeCtx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            bodeCtx.fillRect(0, 0, width, height);
            
            // Draw axes with dB scale
            const maxDB = 20 * Math.log10(normalizeMax / 255 + 0.001);
            drawAxes(bodeCtx, width, height, 'Frequency (Hz)', 'Magnitude (dB)', maxDB);
            
            // Draw frequency response
            bodeCtx.strokeStyle = '#00ff88';
            bodeCtx.lineWidth = 2;
            bodeCtx.beginPath();
            
            const nyquist = audioContext.sampleRate / 2;
            let maxVal = 0;
            let maxIdx = 0;
            let fundamentalIdx = -1;
            let rmsSum = 0;
            
            for (let i = 1; i < bufferLength; i++) {
                const freq = (i / bufferLength) * nyquist;
                const x = MARGIN.left + (Math.log10(freq) - Math.log10(1)) / 
                          (Math.log10(nyquist) - Math.log10(1)) * plotWidth;
                
                const magnitude = dataArray[i];
                const normalizedMag = magnitude / normalizeMax;
                const db = 20 * Math.log10(normalizedMag + 0.001);
                const normalizedDB = (db - (maxDB - 60)) / 60; // 60dB range
                
                const y = MARGIN.top + plotHeight * (1 - normalizedDB);
                
                if (i === 1) {
                    bodeCtx.moveTo(x, y);
                } else {
                    bodeCtx.lineTo(x, y);
                }
                
                if (magnitude > maxVal && i > 5) {
                    maxVal = magnitude;
                    maxIdx = i;
                }
                
                if (magnitude > normalizeMax * 0.3 && fundamentalIdx === -1 && i > 10) {
                    fundamentalIdx = i;
                }
                
                rmsSum += normalizedMag * normalizedMag;
            }
            
            bodeCtx.stroke();
            
            // Frequency axis (log scale)
            bodeCtx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            bodeCtx.textAlign = 'center';
            bodeCtx.textBaseline = 'top';
            const logFreqs = [10, 100, 1000, 10000];
            for (let freq of logFreqs) {
                if (freq <= nyquist) {
                    const x = MARGIN.left + (Math.log10(freq) - Math.log10(1)) / 
                              (Math.log10(nyquist) - Math.log10(1)) * plotWidth;
                    bodeCtx.fillText(freq >= 1000 ? (freq/1000 + 'k') : freq, x, height - MARGIN.bottom + 5);
                }
            }
            
            // Update info
            const peakFreq = (maxIdx / bufferLength) * nyquist;
            document.getElementById('peakFreq').textContent = peakFreq.toFixed(1) + ' Hz';
            
            if (fundamentalIdx > 0) {
                const fundFreq = (fundamentalIdx / bufferLength) * nyquist;
                document.getElementById('fundamental').textContent = fundFreq.toFixed(1) + ' Hz';
            }
            
            const rms = Math.sqrt(rmsSum / bufferLength);
            const dbLevel = 20 * Math.log10(rms + 0.0001);
            document.getElementById('rmsLevel').textContent = dbLevel.toFixed(1) + ' dB';
        }
        
        function draw() {
            animationId = requestAnimationFrame(draw);
            
            // Only update plots if not frozen
            if (!isFrozen) {
                drawWaveform();
                drawFFT();
                drawSpectrogram();
                drawBode();
            }
        }
        
        startBtn.addEventListener('click', startAudio);
        stopBtn.addEventListener('click', stopAudio);
        freezeBtn.addEventListener('click', toggleFreeze);
    </script>
